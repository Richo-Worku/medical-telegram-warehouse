version: 2

# =========================
# SOURCES (IMPORTANT FIX)
# =========================
sources:
  - name: raw
    schema: raw
    tables:
      - name: telegram_messages
      - name: yolo_detections


models:

  # =========================
  # FACT: MESSAGES
  # =========================
  - name: fct_messages
    description: "Fact table containing Telegram messages"

    columns:
      - name: message_id
        tests:
          - not_null
          - unique

      - name: channel_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: message_text
      - name: message_length
      - name: views
      - name: forwards
      - name: has_image


  # =========================
  # DIM: CHANNELS
  # =========================
  - name: dim_channels
    description: "Channel dimension"

    columns:
      - name: channel_key
        tests:
          - not_null
          - unique

      - name: channel_name
        tests:
          - not_null

      - name: channel_type
      - name: first_post_date
      - name: last_post_date
      - name: total_posts
      - name: avg_views


  # =========================
  # DIM: DATES
  # =========================
  - name: dim_dates
    description: "Date dimension"

    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: full_date
        tests:
          - not_null
          - unique

      - name: day_of_week
      - name: day_name
      - name: week_of_year
      - name: month
      - name: month_name
      - name: quarter
      - name: year
      - name: is_weekend


  # =========================
  # FACT: YOLO IMAGE DETECTIONS
  # =========================
  - name: fct_image_detections
    description: "YOLO object detection results linked to Telegram messages"

    columns:
      - name: message_id
        tests:
          - not_null

      - name: channel_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_key

      - name: detected_class
      - name: confidence_score
      - name: image_category